# Sniff 工程描述文件 —— 由 XcodeGen 生成 Sniff.xcodeproj
# 用法（macOS）：brew install xcodegen && xcodegen generate
name: Sniff
options:
  bundleIdPrefix: com.sniff
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

targets:
  Sniff:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sniff
        excludes:
          - "Bridge/Sniff-Bridging-Header.h"
    info:
      path: Sniff/Resources/Info.plist
      properties:
        CFBundleDisplayName: 嗅探
        CFBundleName: Sniff
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "31"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: 需要相册写入权限，用于保存嗅探到的图片和视频
        NSPhotoLibraryUsageDescription: 需要读取相册，用于选择实况照片转换和图片压缩
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      # FFmpeg（社区重编译的 xcframework，CI 里下载到 Vendor/）
      - framework: Vendor/ffmpegkit.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libavcodec.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libavformat.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libavutil.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libswresample.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libswscale.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libavfilter.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/libavdevice.xcframework
        embed: true
        codeSign: true
      # FFmpeg 依赖的系统库
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: "libc++.tbd"
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sniff.ios
        SWIFT_OBJC_BRIDGING_HEADER: Sniff/Bridge/Sniff-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST: "NO"
        INFOPLIST_FILE: Sniff/Resources/Info.plist
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "31"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
